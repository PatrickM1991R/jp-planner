<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medewerker login - JP Planner</title><style>
:root{--p:#140821;--g:#c9a227;--gd:#ad891d;--bg:#f7f4fb;--b:#ebe4f2}*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:#17131d}.wrap{max-width:520px;margin:70px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--b);border-radius:28px;padding:28px;box-shadow:0 18px 45px rgba(36,17,63,.10)}h1{color:var(--p);margin-top:0}label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px}input{width:100%;padding:11px;border:1px solid #d9d0e3;border-radius:10px}button,.btn{display:block;text-align:center;text-decoration:none;margin-top:18px;width:100%;padding:12px;border:0;border-radius:999px;background:var(--g);color:#fff;font-weight:900;cursor:pointer}.btn.secondary{background:#fff;color:var(--p);border:1px solid var(--b)}button:hover{background:var(--gd)}.err{background:#fff0f0;color:#8b1d1d;padding:10px;border-radius:10px;margin-bottom:12px}.ok{background:#edf9f1;color:#166534;padding:10px;border-radius:10px;margin-bottom:12px}.muted{color:#655c70;font-size:12px}.divider{text-align:center;color:#8a8291;font-size:11px;margin:15px 0 -5px}</style><style id="jp-unified-theme">:root{--jp-purple:#140821;--jp-gold:#c9a227;--jp-light:#f7f4fb;--jp-border:#ebe4f2}body{background:var(--jp-light);font-family:Arial,Helvetica,sans-serif;color:#211a28}button,.linkbtn{border-radius:12px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c9a227;outline-offset:2px}.jp-quicknav{max-width:1450px;margin:20px auto 22px;padding:0 20px;box-sizing:border-box}.jp-quicknav .jp-nav-title{font-weight:900;color:#140821;font-size:15px;margin:0 0 12px}.jp-nav-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.jp-nav-tile{box-sizing:border-box;min-height:135px;background:white;border:1px solid #ebe4f2;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:9px;text-decoration:none!important;color:#24113f!important;box-shadow:0 8px 22px #24113f0c;transition:transform .16s,box-shadow .16s}.jp-nav-tile:hover{transform:translateY(-3px);box-shadow:0 13px 25px #24113f20}.jp-nav-icon{width:45px;height:45px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--tile-bg);color:var(--tile-color);font-size:25px;font-weight:800}.jp-nav-tile strong{font-size:13px;line-height:1.35}.jp-nav-tile:nth-child(1){--tile-bg:#e8f0ff;--tile-color:#3569d8}.jp-nav-tile:nth-child(2){--tile-bg:#e4f7f2;--tile-color:#0f9a87}.jp-nav-tile:nth-child(3){--tile-bg:#fff0e5;--tile-color:#e46b24}.jp-nav-tile:nth-child(4){--tile-bg:#f3eafe;--tile-color:#8a4dd0}.jp-nav-tile:nth-child(5){--tile-bg:#fce8f2;--tile-color:#db2777}.jp-nav-tile:nth-child(6){--tile-bg:#e3f7fb;--tile-color:#0891b2}@media(max-width:600px){.jp-nav-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.jp-nav-tile{min-height:115px;padding:12px}}@media(prefers-reduced-motion:reduce){.jp-nav-tile{transition:none}}</style></head><body><div class="wrap"><div class="card"><h1>Mijn rooster</h1><p class="muted">Log in met je gebruikersnaam of e-mailadres. Je ziet daarna alleen je eigen dagplanning en weekrooster.</p>{% if message %}<div class="ok">{{message}}</div>{% endif %}{% if error %}<div class="err">{{error}}</div>{% endif %}<form method="post"><label>Gebruikersnaam of e-mail</label><input name="login" autocomplete="username" required><label>Wachtwoord</label><input type="password" name="password" autocomplete="current-password" required><button type="submit">Inloggen</button></form><div class="divider">Eerste keer?</div><a class="btn secondary" href="/staff/activate">Wachtwoord aanmaken</a></div></div></body></html>
