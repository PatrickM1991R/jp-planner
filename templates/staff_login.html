<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medewerker login - JP Planner</title><style>
:root{--p:#140821;--g:#c9a227;--gd:#ad891d;--bg:#f7f4fb;--b:#ebe4f2}*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:#17131d}.wrap{max-width:520px;margin:70px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--b);border-radius:28px;padding:28px;box-shadow:0 18px 45px rgba(36,17,63,.10)}h1{color:var(--p);margin-top:0}label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px}input{width:100%;padding:11px;border:1px solid #d9d0e3;border-radius:10px}button,.btn{display:block;text-align:center;text-decoration:none;margin-top:18px;width:100%;padding:12px;border:0;border-radius:999px;background:var(--g);color:#fff;font-weight:900;cursor:pointer}.btn.secondary{background:#fff;color:var(--p);border:1px solid var(--b)}button:hover{background:var(--gd)}.err{background:#fff0f0;color:#8b1d1d;padding:10px;border-radius:10px;margin-bottom:12px}.ok{background:#edf9f1;color:#166534;padding:10px;border-radius:10px;margin-bottom:12px}.muted{color:#655c70;font-size:12px}.divider{text-align:center;color:#8a8291;font-size:11px;margin:15px 0 -5px}</style></head><body><div class="wrap"><div class="card"><h1>Mijn rooster</h1><p class="muted">Log in met je gebruikersnaam of e-mailadres. Je ziet daarna alleen je eigen dagplanning en weekrooster.</p>{% if message %}<div class="ok">{{message}}</div>{% endif %}{% if error %}<div class="err">{{error}}</div>{% endif %}<form method="post"><label>Gebruikersnaam of e-mail</label><input name="login" autocomplete="username" required><label>Wachtwoord</label><input type="password" name="password" autocomplete="current-password" required><button type="submit">Inloggen</button></form><div class="divider">Eerste keer?</div><a class="btn secondary" href="/staff/activate">Wachtwoord aanmaken</a></div></div></body></html>
