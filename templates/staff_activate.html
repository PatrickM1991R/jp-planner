<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wachtwoord aanmaken - JP Planner</title><style>
:root{--p:#140821;--g:#c9a227;--gd:#ad891d;--bg:#f7f4fb;--b:#ebe4f2}*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:#17131d}.wrap{max-width:520px;margin:60px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--b);border-radius:28px;padding:28px;box-shadow:0 18px 45px rgba(36,17,63,.10)}h1{color:var(--p);margin-top:0}label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px}input{width:100%;padding:11px;border:1px solid #d9d0e3;border-radius:10px}button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:999px;background:var(--g);color:#fff;font-weight:900;cursor:pointer}.err{background:#fff0f0;color:#8b1d1d;padding:10px;border-radius:10px;margin-bottom:12px}.muted{color:#655c70;font-size:12px}a{color:var(--p);font-weight:800}</style></head><body><div class="wrap"><div class="card"><h1>Wachtwoord aanmaken</h1><p class="muted">Gebruik dit alleen bij je eerste inlog. Je gebruikersnaam en e-mailadres moeten overeenkomen met het personeelsregister.</p>{% if error %}<div class="err">{{error}}</div>{% endif %}<form method="post"><label>Gebruikersnaam</label><input name="login" value="{{login or ''}}" autocomplete="username" required><label>E-mailadres</label><input type="email" name="email" autocomplete="email" required><label>Nieuw wachtwoord</label><input type="password" name="password" minlength="8" autocomplete="new-password" required><label>Herhaal wachtwoord</label><input type="password" name="password2" minlength="8" autocomplete="new-password" required><button type="submit">Wachtwoord opslaan</button></form><p class="muted" style="margin-top:16px"><a href="/staff/login">← Terug naar inloggen</a></p></div></div></body></html>
