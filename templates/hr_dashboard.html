<!doctype html><html lang="nl"><meta charset="utf-8"><title>HR | JP</title><h1>HR-dashboard</h1><p><a href="/staff">Mijn rooster</a> · <a href="/personnel/hours">Diensturen</a></p><p>{{message or ''}}</p>{% for e in people %}<section style="border:1px solid #ddd;padding:12px;margin:10px 0"><h2>{{e.name}}</h2><form method="post" action="/hr/employees/{{e.id}}"><label>Contractvorm <select name="contract_type">{% for v in ['flexkracht','zzp','uitzendbureau','vaste uren'] %}<option value="{{v}}" {% if e.contract_type==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>Vaste uren/week <input type="number" name="weekly_hours" step="0.25" min="0" max="80" value="{{e.weekly_contract_hours}}"></label><button>Opslaan</button></form><p>Handmatig geregistreerd: overuren {{e.overuren}} u · vakantie {{e.vakantie}} u · verlof {{e.verlof}} u · ziekte {{e.ziekte}} u</p><form method="post" action="/hr/employees/{{e.id}}/adjustment"><select name="kind"><option>overuren</option><option>vakantie</option><option>verlof</option><option>ziekte</option></select><input type="number" name="hours" step="0.25" required placeholder="+ of - uren"><input name="note" required placeholder="Reden / toelichting"><button>Mutatie boeken</button></form></section>{% endfor %}</html>
