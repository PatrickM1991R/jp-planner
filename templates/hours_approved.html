<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uren akkoord</title><style>body{font-family:Arial,sans-serif;background:#f7f4fb;margin:0}.card{max-width:600px;margin:70px auto;background:#fff;padding:28px;border-radius:24px;border:1px solid #ebe4f2}h1{color:#140821}.ok{background:#edf9f1;color:#166534;padding:12px;border-radius:10px}</style><style id="jp-unified-theme">:root{--jp-purple:#140821;--jp-gold:#c9a227;--jp-light:#f7f4fb;--jp-border:#ebe4f2}body{background:var(--jp-light);font-family:Arial,Helvetica,sans-serif;color:#211a28}button,.linkbtn{border-radius:12px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c9a227;outline-offset:2px}.jp-quicknav{max-width:1450px;margin:20px auto 22px;padding:0 20px;box-sizing:border-box}.jp-quicknav .jp-nav-title{font-weight:900;color:#140821;font-size:15px;margin:0 0 12px}.jp-nav-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.jp-nav-tile{box-sizing:border-box;min-height:135px;background:white;border:1px solid #ebe4f2;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:9px;text-decoration:none!important;color:#24113f!important;box-shadow:0 8px 22px #24113f0c;transition:transform .16s,box-shadow .16s}.jp-nav-tile:hover{transform:translateY(-3px);box-shadow:0 13px 25px #24113f20}.jp-nav-icon{width:45px;height:45px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--tile-bg);color:var(--tile-color);font-size:25px;font-weight:800}.jp-nav-tile strong{font-size:13px;line-height:1.35}.jp-nav-tile:nth-child(1){--tile-bg:#e8f0ff;--tile-color:#3569d8}.jp-nav-tile:nth-child(2){--tile-bg:#e4f7f2;--tile-color:#0f9a87}.jp-nav-tile:nth-child(3){--tile-bg:#fff0e5;--tile-color:#e46b24}.jp-nav-tile:nth-child(4){--tile-bg:#f3eafe;--tile-color:#8a4dd0}.jp-nav-tile:nth-child(5){--tile-bg:#fce8f2;--tile-color:#db2777}.jp-nav-tile:nth-child(6){--tile-bg:#e3f7fb;--tile-color:#0891b2}@media(max-width:600px){.jp-nav-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.jp-nav-tile{min-height:115px;padding:12px}}@media(prefers-reduced-motion:reduce){.jp-nav-tile{transition:none}}</style></head><body><div class="card"><h1>Uren geaccordeerd</h1><div class="ok">De aangepaste uren van <strong>{{shift.employee_name}}</strong> voor {{shift.work_date}} zijn akkoord gezet.</div><p>Je kunt dit later altijd opnieuw aanpassen via de personeelsadministratie.</p><p><a href="/personnel/hours">Naar urenadministratie</a></p></div></body></html>
